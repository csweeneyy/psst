name: Psst
options:
  bundleIdPrefix: com.connorsweeney
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: "6PY7VW3XF9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Psst:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Psst
    dependencies:
      - target: PsstWidgets
        embed: true
      - target: PsstMonitor
        embed: true
      - target: PsstShield
        embed: true
      - target: PsstShieldAction
        embed: true
    entitlements:
      path: Psst/Psst.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.connorsweeney.Psst
    info:
      path: Psst/Info.plist
      properties:
        CFBundleDisplayName: Psst
        PsstAPIBase: https://psst.connorpsweeney.workers.dev
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing, remote-notification]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAlarmKitUsageDescription: >-
          Psst uses alarms for habits you mark as must-not-miss, so the reminder
          reaches you even when your phone is silenced or in a Focus mode.
        NSSpeechRecognitionUsageDescription: >-
          Psst transcribes your voice so you can adjust your habits without typing.
        NSMicrophoneUsageDescription: >-
          Psst needs the microphone to hear you when you talk to it.
        BGTaskSchedulerPermittedIdentifiers:
          - com.connorsweeney.Psst.refresh
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorsweeney.Psst
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1"

  PsstWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PsstWidgets
    entitlements:
      path: PsstWidgets/PsstWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.connorsweeney.Psst
    info:
      path: PsstWidgets/Info.plist
      properties:
        CFBundleDisplayName: Psst
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorsweeney.Psst.Widgets
        TARGETED_DEVICE_FAMILY: "1"

  PsstMonitor:
    type: app-extension
    platform: iOS
    # Only the two files it needs. These extensions run under a tight memory
    # ceiling, and a shield extension that is slow to answer is replaced by the
    # system's own generic blocker, so compiling the whole app model layer in
    # here would be paid for on screen.
    sources:
      - path: Shared/Types/Lockdown.swift
      - path: Shared/Services/LockdownService.swift
      - path: PsstMonitor
    entitlements:
      path: PsstMonitor/PsstMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.connorsweeney.Psst
    info:
      path: PsstMonitor/Info.plist
      properties:
        CFBundleDisplayName: Psst
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorsweeney.Psst.Monitor
        TARGETED_DEVICE_FAMILY: "1"

  PsstShield:
    type: app-extension
    platform: iOS
    # Only the two files it needs. These extensions run under a tight memory
    # ceiling, and a shield extension that is slow to answer is replaced by the
    # system's own generic blocker, so compiling the whole app model layer in
    # here would be paid for on screen.
    sources:
      - path: Shared/Types/Lockdown.swift
      - path: Shared/Services/LockdownService.swift
      - path: PsstShield
    entitlements:
      path: PsstShield/PsstShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.connorsweeney.Psst
    info:
      path: PsstShield/Info.plist
      properties:
        CFBundleDisplayName: Psst
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorsweeney.Psst.Shield
        TARGETED_DEVICE_FAMILY: "1"

  PsstShieldAction:
    type: app-extension
    platform: iOS
    # Only the two files it needs. These extensions run under a tight memory
    # ceiling, and a shield extension that is slow to answer is replaced by the
    # system's own generic blocker, so compiling the whole app model layer in
    # here would be paid for on screen.
    sources:
      - path: Shared/Types/Lockdown.swift
      - path: Shared/Services/LockdownService.swift
      - path: PsstShieldAction
    entitlements:
      path: PsstShieldAction/PsstShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.connorsweeney.Psst
    info:
      path: PsstShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Psst
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorsweeney.Psst.ShieldAction
        TARGETED_DEVICE_FAMILY: "1"

  PsstUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PsstUITests
    dependencies:
      - target: Psst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorsweeney.Psst.UITests
        GENERATE_INFOPLIST_FILE: YES

  PsstTests:
    type: bundle.unit-test
    platform: iOS
    # Only the test files. `Shared` is compiled into the app target, and
    # recompiling it here too produces two copies of every type, which fails
    # to link against `@testable import Psst`.
    sources:
      - path: PsstTests
    dependencies:
      - target: Psst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorsweeney.Psst.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Psst.app/Psst"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Psst:
    build:
      targets:
        Psst: all
        PsstWidgets: all
        PsstMonitor: all
        PsstShield: all
        PsstShieldAction: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PsstTests
        - PsstUITests
