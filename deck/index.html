<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psst</title>
<style>
  /* One fixed 1280x720 canvas, scaled to whatever window it lands in.
     Nothing reflows, so nothing clips. */
  :root {
    --ink: #161618;
    --ink-2: #6E6E73;
    --ink-3: #8E8E93;
    --canvas: #F2F2F7;
    --surface: #FFFFFF;
    --hairline: rgba(60, 60, 67, 0.16);
    --ok: #248A3D;
    --bad: #C9251C;
    --s: 1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--canvas);
  }

  body {
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    color: var(--ink);
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .deck {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide {
    width: 1280px;
    height: 720px;
    zoom: var(--s);
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 54px 76px;
    background: var(--canvas);
    overflow: hidden;
  }

  .slide.is-active { display: flex; }

  .inner { width: 100%; }

  .kicker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    margin: 0 0 16px;
  }

  h1 {
    font-size: 150px;
    line-height: 0.94;
    letter-spacing: -0.055em;
    font-weight: 700;
    margin: 0 0 24px;
  }

  h2 {
    font-size: 52px;
    line-height: 1.03;
    letter-spacing: -0.034em;
    font-weight: 700;
    margin: 0 0 16px;
    max-width: 25ch;
  }

  .lead {
    font-size: 22px;
    line-height: 1.38;
    letter-spacing: -0.014em;
    max-width: 60ch;
    margin: 0 0 22px;
  }

  .sub {
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink-2);
    max-width: 96ch;
    margin: 16px 0 0;
    letter-spacing: -0.004em;
  }

  .sub b { color: var(--ink); font-weight: 600; }

  /* Inset list surfaces: white on grouped grey, hairline rows, no shadows. */
  .card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
  }

  .row {
    padding: 13px 20px;
    border-top: 1px solid var(--hairline);
    font-size: 16px;
    line-height: 1.38;
    letter-spacing: -0.008em;
  }

  .row:first-child { border-top: 0; }
  .row b { font-weight: 600; }
  .row span { color: var(--ink-2); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    font-size: 16px;
  }

  th, td {
    text-align: left;
    padding: 15px 16px;
    border-top: 1px solid var(--hairline);
    letter-spacing: -0.008em;
    vertical-align: top;
  }

  thead th {
    border-top: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  tbody th { font-weight: 600; }

  code, .mono {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.9em;
    letter-spacing: 0;
  }

  /* Colour is status only: yes, no, shipped, outstanding. */
  .yes { color: var(--ok); font-weight: 600; }
  .no { color: var(--bad); font-weight: 600; }

  ul { margin: 0; padding: 0; list-style: none; }

  ul.bullets li {
    font-size: 19px;
    line-height: 1.36;
    letter-spacing: -0.012em;
    margin: 0 0 14px;
    padding-left: 22px;
    position: relative;
    max-width: 80ch;
  }

  ul.bullets li:last-child { margin-bottom: 0; }

  ul.bullets li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 0.58em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink);
  }

  .title-slide .lead { font-size: 25px; max-width: 46ch; }

  .rule {
    height: 1px;
    background: var(--hairline);
    border: 0;
    margin: 30px 0;
  }

  /* Navigation */
  /* Screenshots. Deliberately unframed: a drawn bezel dates a deck faster
     than anything else, and the app's own rounded corners read as a phone. */
  .shots {
    position: absolute;
    right: 56px;
    bottom: -34px;
    display: flex;
    align-items: flex-end;
    gap: 22px;
    pointer-events: none;
  }
  .shots img {
    display: block;
    width: 232px;
    border-radius: 26px;
    border: 1px solid rgba(22, 22, 24, 0.10);
  }
  .shots img.back { width: 204px; opacity: 0.5; margin-bottom: 30px; }
  .slide.has-shots .inner { max-width: 620px; }
  .slide.has-shots h2 { font-size: 46px; }

  .title-icon {
    width: 112px;
    height: 112px;
    border-radius: 25px;
    display: block;
    margin-bottom: 26px;
    border: 1px solid rgba(22, 22, 24, 0.08);
  }

  .stamp {
    position: absolute;
    left: 64px;
    bottom: 34px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .stamp img { width: 20px; height: 20px; border-radius: 5px; }
  .stamp span {
    font-size: 12px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: rgba(22, 22, 24, 0.34);
  }

  #counter {
    position: fixed;
    right: 26px;
    bottom: 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    z-index: 20;
  }

  .zone {
    position: fixed;
    top: 0;
    bottom: 0;
    z-index: 10;
    border: 0;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    color: transparent;
  }

  .zone:focus { outline: none; }
  #prev { left: 0; width: 24%; cursor: w-resize; }
  #next { right: 0; width: 76%; cursor: e-resize; }

  /* ?print stacks every slide, one per page. */
  body.print-mode { overflow: auto; }

  body.print-mode .deck {
    position: static;
    display: block;
    padding: 0;
  }

  body.print-mode .slide {
    display: flex;
    margin: 0 auto;
    border-bottom: 1px solid var(--hairline);
    break-after: page;
    page-break-after: always;
  }

  body.print-mode .slide:last-child { border-bottom: 0; }
  body.print-mode #counter,
  body.print-mode .zone { display: none; }

  @page { size: 1280px 720px; margin: 0; }

  @media print {
    html, body { height: auto; overflow: visible; }
    #counter, .zone { display: none !important; }
    .deck { position: static; display: block; padding: 0; }
    .slide {
      display: flex !important;
      zoom: 1;
      margin: 0;
      border-bottom: 0;
      break-after: page;
      page-break-after: always;
    }
    .slide:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>

<main class="deck" id="deck"></main>

<button class="zone" id="prev" type="button" aria-label="Previous slide">Previous</button>
<button class="zone" id="next" type="button" aria-label="Next slide">Next</button>
<div id="counter" aria-live="polite"></div>

<!-- Every word on every slide lives in slides.js. This file is only the layout. -->
<script src="slides.js"></script>
<script>
(function () {
  var deck = document.getElementById('deck');
  var counter = document.getElementById('counter');

  function esc(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /* *stars* come out bold, `backticks` come out as code. */
  function fmt(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*([^*]+)\*/g, '<b>$1</b>');
  }

  /* A card line that opens with *a bold phrase* gets the rest in grey. */
  function cardRow(line) {
    var lead = /^\*([^*]+)\*\s*/.exec(line);
    if (!lead) { return '<div class="row">' + fmt(line) + '</div>'; }
    return '<div class="row"><b>' + fmt(lead[1]) + '</b> <span>'
      + fmt(line.slice(lead[0].length)) + '</span></div>';
  }

  /* A cell that says only yes or no is the one place colour is used. */
  function cell(tag, text) {
    var status = /^(yes|no)$/i.test(text) ? ' class="' + text.toLowerCase() + '"' : '';
    return '<' + tag + status + '>' + fmt(text) + '</' + tag + '>';
  }

  function tableHtml(table) {
    var html = '<table><thead><tr>';
    table.columns.forEach(function (c) { html += '<th>' + fmt(c) + '</th>'; });
    html += '</tr></thead><tbody>';
    table.rows.forEach(function (row) {
      html += '<tr>';
      row.forEach(function (text, i) { html += cell(i === 0 ? 'th' : 'td', text); });
      html += '</tr>';
    });
    return html + '</tbody></table>';
  }

  function slideHtml(slide, n) {
    var html = '';
    if (slide.kicker) {
      html += '<p class="kicker">' + (n < 10 ? '0' + n : n) + ' / ' + fmt(slide.kicker) + '</p>';
    }
    if (slide.icon) { html += '<img class="title-icon" src="' + slide.icon + '" alt="">'; }
    if (slide.big) { html += '<h1>' + fmt(slide.big) + '</h1>'; }
    if (slide.title) { html += '<h2>' + fmt(slide.title) + '</h2>'; }
    if (slide.lead) { html += '<p class="lead">' + fmt(slide.lead) + '</p>'; }
    if (slide.bullets) {
      html += '<ul class="bullets">';
      slide.bullets.forEach(function (b) { html += '<li>' + fmt(b) + '</li>'; });
      html += '</ul>';
    }
    if (slide.card) {
      html += '<div class="card">';
      slide.card.forEach(function (line) { html += cardRow(line); });
      html += '</div>';
    }
    if (slide.table) { html += tableHtml(slide.table); }
    if (slide.note) {
      if (slide.big) { html += '<hr class="rule">'; }
      html += '<p class="sub">' + fmt(slide.note) + '</p>';
    }
    return html;
  }

  var data = (typeof SLIDES === 'undefined') ? [] : SLIDES;

  data.forEach(function (slide, i) {
    var section = document.createElement('section');
    section.className = 'slide' + (slide.big ? ' title-slide' : '');
    section.setAttribute('aria-label', slide.title || slide.big || ('Slide ' + (i + 1)));
    var shots = '';
    if (slide.shots && slide.shots.length) {
      section.className += ' has-shots';
      shots = '<div class="shots">';
      slide.shots.forEach(function (src, k) {
        shots += '<img class="' + (k < slide.shots.length - 1 ? 'back' : '') + '" src="' + src + '" alt="">';
      });
      shots += '</div>';
    }
    // Every slide but the title carries the mark, so a photographed slide is
    // still obviously this product.
    var stamp = slide.big ? '' :
      '<div class="stamp"><img src="img/icon.png" alt=""><span>Psst</span></div>';
    section.innerHTML = '<div class="inner">' + slideHtml(slide, i + 1) + '</div>' + shots + stamp;
    deck.appendChild(section);
  });

  if (data.length && (data[0].big || data[0].title)) {
    document.title = data[0].big || data[0].title;
  }

  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var total = slides.length;
  var printMode = /(^|[?&])print(=|&|$)/.test(window.location.search);
  var index = 0;

  function fit() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    if (printMode) { s = Math.min(1, window.innerWidth / 1280); }
    document.documentElement.style.setProperty('--s', s);
  }

  window.addEventListener('resize', fit);
  fit();

  counter.textContent = '0 / ' + total;
  if (!total) { return; }

  if (printMode) {
    document.body.classList.add('print-mode');
    for (var i = 0; i < total; i++) { slides[i].classList.add('is-active'); }
    return;
  }

  function show(n) {
    index = n < 0 ? 0 : (n > total - 1 ? total - 1 : n);
    for (var i = 0; i < total; i++) {
      if (i === index) {
        slides[i].classList.add('is-active');
      } else {
        slides[i].classList.remove('is-active');
      }
    }
    counter.textContent = (index + 1) + ' / ' + total;
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '#s' + (index + 1));
    }
  }

  function fromHash() {
    var m = /^#s(\d+)$/.exec(window.location.hash);
    return m ? parseInt(m[1], 10) - 1 : 0;
  }

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) { return; }
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      show(index + 1);
    } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') {
      e.preventDefault();
      show(index - 1);
    } else if (k === 'Home') {
      e.preventDefault();
      show(0);
    } else if (k === 'End') {
      e.preventDefault();
      show(total - 1);
    }
  });

  document.getElementById('prev').addEventListener('click', function () { show(index - 1); });
  document.getElementById('next').addEventListener('click', function () { show(index + 1); });
  window.addEventListener('hashchange', function () { show(fromHash()); });

  show(fromHash());
})();
</script>

</body>
</html>
