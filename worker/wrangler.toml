name = "psst"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "psst"
database_id = "4ccf990d-6ff5-4b54-9923-0b4f8118fd16"

[vars]
# Ordered by `bun run eval`, re-measured 2026-09-27 against the deployed Worker.
# Both entries score 20/20; the order is fastest first, and a model only loses
# a turn when it observably fails or passes its deadline.
#
#   deepseek-v4.1-flash     20/20  one pass 2.5-4.1s   tool turn 4.2-5.0s    <- primary
#   deepseek-v4-pro         20/20  one pass 18-28s     tool turn 15-17s      <- last resort
#
# deepseek-v4-flash-0731 was the primary until it stopped being fast. On the
# identical prompt (5.1k input tokens both) it now answers one pass in 9.7 to
# 21.5s against 2.5 to 4.1s for v4.1-flash, and a two-call tool turn in 29 to
# 32s against 4.2 to 5.0s: roughly 25 tokens/sec against 97. It is not wrong,
# only slow, and slowness never triggered escalation, so every request paid it.
# Dropped rather than demoted: at 30s a turn it cannot finish inside the 12s
# failover leash, so keeping it anywhere in the chain only burns the leash.
#
# glm-5.3-flash and gpt-oss-120b stay rejected on accuracy, not speed:
# gpt-oss-120b edited one habit when the user named two, and changed a setting
# where the right answer was to ask a question.
MODEL_CHAIN = "openrouter:deepseek/deepseek-v4.1-flash,openrouter:deepseek/deepseek-v4-pro"

# Secrets, one per provider you actually use:
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put DEEPSEEK_API_KEY     (direct, lower latency than OpenRouter)
#   wrangler secret put FIREWORKS_API_KEY
