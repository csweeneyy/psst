name = "psst"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "psst"
database_id = "4ccf990d-6ff5-4b54-9923-0b4f8118fd16"

[vars]
# Chosen by `bun run eval`, 2026-09-26. All three score 15/15; the order is
# cheapest first, and a model only loses a turn when it observably fails.
#
#   deepseek-v4-flash-0731  15/15  median 6.8s   $0.021 / $0.320   <- primary
#   deepseek-v4.1-flash     15/15  median 8.4s   $0.035 / $0.290
#   deepseek-v4-pro         15/15  median 8.6s   $0.348 / $0.696   <- last resort
#   glm-5.3-flash           14/15  median 13.7s  $0.040 / $0.500
#   gpt-oss-120b            13/15  median 6.0s   $0.150 / $0.600   <- rejected
#
# gpt-oss-120b failed two cases that matter: it edited only one habit when the
# user named two, and it changed a setting when the right answer was to ask a
# question. Both are the kind of failure you would not notice until it had
# quietly rewritten a schedule.
MODEL_CHAIN = "openrouter:deepseek/deepseek-v4-flash-0731,openrouter:deepseek/deepseek-v4.1-flash,openrouter:deepseek/deepseek-v4-pro"

# Secrets, one per provider you actually use:
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put DEEPSEEK_API_KEY     (direct, lower latency than OpenRouter)
#   wrangler secret put FIREWORKS_API_KEY
